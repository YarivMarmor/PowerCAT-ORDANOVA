[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "powercatordanova"
version = "0.5.0"
description = "CATANOVA and ORDANOVA research implementation (validation preview)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.7,<4"]
[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]
[tool.setuptools.packages.find]
where = ["src"]
