name: Build Windows preview
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PowerCAT_ORDANOVA --paths src run_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PowerCAT_ORDANOVA_windows_preview
          path: dist/PowerCAT_ORDANOVA.exe
